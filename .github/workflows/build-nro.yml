name: Build MHGU LS NRO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust & nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install xPack ARM GCC
        run: |
          curl -L -o arm-gcc.tar.gz https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz
          tar -xzf arm-gcc.tar.gz
          echo "$PWD/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin" >> $GITHUB_PATH
          echo "ARM_GCC=$PWD/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/arm-none-eabi-gcc" >> $GITHUB_ENV

      - name: Install cargo-mhgu-forge
        run: |
          cargo install cargo-mhgu-forge --version 1.5.0 --locked

      - name: Build NRO
        env:
          ML_WORLD_COMBAT: "1"
          ML_WORLD_INPUT_VM: "1"
          ML_WORLD_PRESENTATION: "1"
        run: |
          find . -maxdepth 3 -name "Cargo.toml"
          CARGO_TOML=$(find . -maxdepth 3 -name "Cargo.toml" | head -n 1)
          PROJ_DIR=$(dirname "$CARGO_TOML")
          echo "Building inside: $PROJ_DIR"
          cd "$PROJ_DIR"
          cargo forge build --release || cargo forge build

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhw_ls_rebuild-nro
          path: "**/*.nro"
          
